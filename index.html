<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treni</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Treni">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --card: #f7f7f8;
    --text: #1c1e21;
    --muted: #5f6672;
    --ok: #0f7a2e;
    --warn: #8a5200;
    --bad: #b3261e;
    --line: #e2e4e8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body { padding: 10px 10px 24px; }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 6px 4px 10px;
  }
  h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  #updated { font-size: 0.75rem; color: var(--muted); }
  #filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 4px 12px; }
  #filters button {
    font-size: 0.8rem; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    font-family: inherit; cursor: pointer;
  }
  #filters button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .section-label {
    font-size: 0.75rem; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.03em; padding: 18px 4px 6px;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 14px 10px;
  }
  li:first-child { border-top-left-radius: 12px; border-top-right-radius: 12px; }
  li:last-child { border-bottom: none; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }
  .time { font-size: 1.6rem; font-weight: 700; min-width: 4.4ch; font-variant-numeric: tabular-nums; }
  .mid { flex: 1; min-width: 0; }
  .route { font-size: 1.05rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .via { font-size: 0.78rem; color: var(--muted); }
  .num { font-size: 0.75rem; color: var(--muted); }
  .right { text-align: right; }
  .platform {
    font-size: 1.3rem; font-weight: 800;
    min-width: 2.6ch; text-align: center;
  }
  .platform-label { font-size: 0.62rem; color: var(--muted); font-weight: 500; text-align: center; }
  .delay { font-size: 0.95rem; font-weight: 700; margin-top: 2px; }
  .ok { color: var(--ok); }
  .warn { color: var(--warn); }
  .bad { color: var(--bad); }
  .status-tag {
    font-size: 0.7rem; font-weight: 700; color: var(--bad);
  }
  #empty, #error {
    text-align: center; color: var(--muted); padding: 40px 10px; font-size: 0.95rem;
  }
  #error { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>RE / Rubiera ↔ Parma</h1>
  <span id="updated"></span>
</header>
<div id="filters"></div>
<ul id="list"></ul>
<div id="empty" hidden></div>
<div id="error" hidden>Dati non disponibili al momento.</div>
<div id="historyWrap" hidden>
  <div class="section-label">Partiti di recente</div>
  <ul id="history"></ul>
</div>

<script>
// Nessun backend: fetch diretto dal browser all'API di ViaggiaTreno tramite
// un CORS-proxy pubblico (proxy.cors.sh), che aggiunge l'header
// Access-Control-Allow-Origin necessario per leggere la risposta.
//
// lc-debt: uso anonimo di proxy.cors.sh (nessuna x-cors-api-key). Funziona
// oggi (verificato in sviluppo) ma non e' il modo ufficialmente supportato:
// la doc del servizio richiede una API key gratuita pinnata all'origine.
// Upgrade path se il proxy inizia a rispondere 401/429: creare un progetto
// gratuito su https://cors.sh/console, pinnare la key "live_" al dominio
// GitHub Pages, e valorizzare CORS_API_KEY qui sotto (viene gia' inviata
// automaticamente come header se non vuota).
const CORS_PROXY = 'https://proxy.cors.sh/';
const CORS_API_KEY = ''; // es. 'live_xxxxxxxx', lasciare vuoto per uso anonimo
const VIAGGIATRENO = 'http://www.viaggiatreno.it/infomobilita/resteasy/viaggiatreno';

const STATIONS = { S05023: 'Reggio Emilia', S05031: 'Rubiera', S05014: 'Parma' };
const STATION_COORDS = {
  S05023: { lat: 44.697778, lon: 10.643056 }, // Reggio Emilia
  S05031: { lat: 44.6561,   lon: 10.7802   }, // Rubiera
  S05014: { lat: 44.810271, lon: 10.328393 }, // Parma
};
const GEO_RADIUS_KM = 3;
const WEST_HINTS = ['PARMA', 'FIDENZA', 'PIACENZA', 'CREMONA', 'MILANO'];
const REFRESH_MS = 30000;
const HISTORY_WINDOW_MS = 30 * 60000;
const MAX_MISSED_CYCLES = 3; // tollera qualche hiccup del proxy CORS prima di droppare un treno mai piu' visto

function formatViaggiatrenoDate(date) {
  // lc-debt fix (2026-08-07): l'offset era hardcoded a GMT+0100, sbagliato
  // durante l'ora legale (CEST, fine marzo - fine ottobre). Per ~7 mesi
  // l'anno l'app interrogava l'API un'ora nel futuro rispetto all'ora
  // reale, rischiando di non mostrare treni imminenti. Ora l'offset e'
  // calcolato dinamicamente per la data richiesta.
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Europe/Rome', weekday: 'short', year: 'numeric', month: 'short',
    day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    timeZoneName: 'longOffset',
  }).formatToParts(date);
  const get = (t) => parts.find((p) => p.type === t)?.value;
  let hour = get('hour');
  if (hour === '24') hour = '00';
  const offset = (get('timeZoneName') || 'GMT+01:00').replace(':', '');
  return `${get('weekday')} ${get('month')} ${get('day')} ${get('year')} ${hour}:${get('minute')}:${get('second')} ${offset}`;
}

function formatHHMM(ms) {
  return new Intl.DateTimeFormat('it-IT', {
    timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
  }).format(new Date(ms));
}

async function fetchPartenze(stationId, now) {
  const target = `${VIAGGIATRENO}/partenze/${stationId}/${encodeURIComponent(formatViaggiatrenoDate(now))}`;
  const headers = CORS_API_KEY ? { 'x-cors-api-key': CORS_API_KEY } : {};
  const res = await fetch(CORS_PROXY + target, { headers, cache: 'no-store' });
  if (!res.ok) throw new Error(`partenze ${stationId}: HTTP ${res.status}`);
  const data = await res.json();
  return Array.isArray(data) ? data : [];
}

function destText(t) { return (t.destinazione || '').toUpperCase(); }
function fallbackWest(t) { return WEST_HINTS.some((h) => destText(t).includes(h)) ? new Set(['S05014']) : null; }
// Un treno che va "oltre Rubiera" (Modena/Bologna/Ancona/...) non e' detto
// che si fermi davvero a Rubiera (verificato 2026-08-07: treno 3929/3931
// Piacenza->Ancona ferma a Reggio Emilia ma salta Rubiera). Il nome della
// destinazione finale non basta: le fermate reali si sanno solo via
// andamentoTreno (vedi fetchAndamento/collectFromParma piu' sotto).
function isWestbound(t) { return WEST_HINTS.some((h) => destText(t).includes(h)); }
function trainStatus(t) {
  if (t.provvedimento === 1) return 'cancellato';
  if (t.provvedimento === 2) return 'parzialmente cancellato';
  if (t.nonPartito) return 'non partito';
  return 'regolare';
}
function buildRow(t, originId, destLabel) {
  const ritardo = typeof t.ritardo === 'number' ? t.ritardo : 0;
  return {
    numeroTreno: t.numeroTreno,
    origine: STATIONS[originId],
    destinazione: destLabel,
    orarioProgrammato: t.compOrarioPartenza,
    orarioPartenzaMs: t.orarioPartenza,
    ritardo,
    actualDepartureMs: t.orarioPartenza + ritardo * 60000,
    binario: t.binarioEffettivoPartenzaDescrizione || t.binarioProgrammatoPartenzaDescrizione || null,
    stato: trainStatus(t),
  };
}
function collect(partenze, stationId, fallbackFn, labelFor) {
  const rows = [];
  for (const t of partenze.filter((x) => x.categoriaDescrizione === 'REG')) {
    const touched = fallbackFn(t);
    if (!touched || touched.size === 0) continue;
    const label = labelFor(touched);
    if (!label) continue;
    rows.push(buildRow(t, stationId, label));
  }
  return rows;
}

// Cache delle fermate reali per treno (chiave codOrigine_numeroTreno_data,
// numeroTreno da solo non e' univoco). Una corsa/giorno non cambia le sue
// fermate schedulate entro la sessione, quindi non va invalidata: si perde
// solo al reload (stesso pattern lc-debt di trainState).
const andamentoCache = new Map();
async function fetchAndamento(t) {
  const key = `${t.codOrigine}_${t.numeroTreno}_${t.dataPartenzaTreno}`;
  if (andamentoCache.has(key)) return andamentoCache.get(key);
  try {
    const target = `${VIAGGIATRENO}/andamentoTreno/${t.codOrigine}/${t.numeroTreno}/${t.dataPartenzaTreno}`;
    const headers = CORS_API_KEY ? { 'x-cors-api-key': CORS_API_KEY } : {};
    const res = await fetch(CORS_PROXY + target, { headers, cache: 'no-store' });
    if (res.status === 204 || !res.ok) return null; // dato non disponibile questo giro, si ritenta al prossimo refresh (non si cachano i fallimenti)
    const data = await res.json();
    const stops = new Set((data.fermate || []).filter((f) => f.actualFermataType !== 3).map((f) => f.id));
    andamentoCache.set(key, stops);
    return stops;
  } catch (e) {
    return null;
  }
}

// Destinazione per la tab Parma: non si deduce dal nome della destinazione
// finale (un regionale puo' saltare Rubiera pur continuando oltre, vedi
// isWestbound() sopra) ma dalle fermate reali via andamentoTreno.
async function collectFromParma(partenze, stationId) {
  const candidates = partenze.filter((x) => x.categoriaDescrizione === 'REG' && !isWestbound(x));
  const stopsList = await Promise.all(candidates.map(fetchAndamento)); // in parallelo: sequenziale su un proxy CORS fragile costerebbe secondi al primo giro
  const rows = [];
  candidates.forEach((t, i) => {
    const stops = stopsList[i];
    if (!stops) return; // fetch fallito/non disponibile: si scarta piuttosto che indovinare l'etichetta
    const label = stops.has('S05031') ? 'Rubiera' : stops.has('S05023') ? 'Reggio Emilia' : null;
    if (!label) return; // non passa da Reggio Emilia: altra linea (es. Parma-Suzzara, Pontremolese), non e' questa tratta
    rows.push(buildRow(t, stationId, label));
  });
  return rows;
}

async function fetchTrains() {
  const now = new Date();
  const [reP, ruP, prP] = await Promise.all([
    fetchPartenze('S05023', now),
    fetchPartenze('S05031', now),
    fetchPartenze('S05014', now),
  ]);
  const reRows = collect(reP, 'S05023', fallbackWest, () => 'Parma');
  const ruRows = collect(ruP, 'S05031', fallbackWest, () => 'Parma');
  const prRows = await collectFromParma(prP, 'S05014');
  // Ordinamento reale (per orario effettivo) applicato in deriveLists(), non qui.
  return [...reRows, ...ruRows, ...prRows];
}

// --- Stato treni: fonte di verita' unica per lista principale + storico ---
// lc-debt: storico solo in-memory, nessuna persistenza (localStorage) tra
// reload. Upgrade path se necessario: localStorage con TTL 30min.
const trainState = new Map();
function trainKey(row) { return `${row.numeroTreno}_${row.origine}_${row.orarioProgrammato}`; }

function updateTrainState(freshRows, now) {
  const freshKeys = new Set();
  for (const row of freshRows) {
    const key = trainKey(row);
    freshKeys.add(key);
    trainState.set(key, { row, missedCycles: 0, lastSeenAt: now });
  }
  for (const [key, entry] of trainState) {
    if (freshKeys.has(key)) continue;
    entry.missedCycles += 1;
    // Mai piu' visto dopo qualche ciclo: droppa a prescindere da stato/orario,
    // altrimenti resterebbe congelato in cima alla lista con dati stantii.
    if (entry.missedCycles > MAX_MISSED_CYCLES) trainState.delete(key);
  }
  // Pruning incondizionato (backstop indipendente da missedCycles): un'entry
  // vista regolarmente ma con orario ormai troppo vecchio esce comunque.
  for (const [key, entry] of trainState) {
    if (entry.row.actualDepartureMs < now - HISTORY_WINDOW_MS) trainState.delete(key);
  }
}

function deriveLists(now) {
  const upcoming = [];
  const storico = [];
  for (const entry of trainState.values()) {
    if (entry.row.actualDepartureMs > now) upcoming.push(entry.row);
    else storico.push(entry.row);
  }
  upcoming.sort((a, b) => a.actualDepartureMs - b.actualDepartureMs);
  storico.sort((a, b) => b.actualDepartureMs - a.actualDepartureMs);
  return { upcoming, storico };
}

// --- Filtro stazione di partenza + geolocalizzazione ---
let selectedStation = null; // codice stazione, o null = "Tutte"
let userOverrodeFilter = false;
let latestUpcoming = [];
let latestHistory = [];
let hasFetchedOnce = false;

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function makeChip(code, label) {
  const btn = document.createElement('button');
  btn.textContent = label;
  btn.dataset.code = code || '';
  btn.addEventListener('click', () => {
    userOverrodeFilter = true;
    selectedStation = code;
    applyFilterAndRender();
  });
  return btn;
}

function updateFilterChipsUI() {
  const container = document.getElementById('filters');
  for (const btn of container.children) {
    const code = btn.dataset.code || null;
    btn.classList.toggle('active', code === selectedStation);
  }
}

function initFilters() {
  const container = document.getElementById('filters');
  container.appendChild(makeChip(null, 'Tutte'));
  for (const code of Object.keys(STATIONS)) container.appendChild(makeChip(code, STATIONS[code]));
  updateFilterChipsUI();
  tryAutoSelectByGeolocation();
}

function tryAutoSelectByGeolocation() {
  if (!('geolocation' in navigator)) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      if (userOverrodeFilter) return;
      const { latitude, longitude } = pos.coords;
      let nearest = null;
      let nearestDist = Infinity;
      for (const [code, coord] of Object.entries(STATION_COORDS)) {
        const d = haversineKm(latitude, longitude, coord.lat, coord.lon);
        if (d < nearestDist) { nearestDist = d; nearest = code; }
      }
      if (nearest && nearestDist <= GEO_RADIUS_KM) {
        selectedStation = nearest;
        applyFilterAndRender();
      }
    },
    () => {}, // permesso negato/errore/timeout: nessun filtro, fallimento silenzioso
    { timeout: 5000, maximumAge: 60000 }
  );
}

function applyFilterAndRender() {
  updateFilterChipsUI();
  if (!hasFetchedOnce) return; // aspetta il primo fetch, altrimenti si mostra "vuoto" prima del tempo
  const filterName = selectedStation ? STATIONS[selectedStation] : null;
  const upcoming = filterName ? latestUpcoming.filter((r) => r.origine === filterName) : latestUpcoming;
  const storico = filterName ? latestHistory.filter((r) => r.origine === filterName) : latestHistory;
  render(upcoming, filterName);
  renderHistory(storico);
}

function delayClass(min, stato) {
  if (stato === 'cancellato' || stato === 'parzialmente cancellato') return 'bad';
  if (stato === 'non partito') return 'warn';
  if (min >= 15) return 'bad';
  if (min >= 5) return 'warn';
  return 'ok';
}

function delayText(min, stato, actualDepartureMs) {
  if (stato === 'cancellato') return 'CANCELLATO';
  if (stato === 'parzialmente cancellato') return 'PARZ. CANCELLATO';
  if (stato === 'non partito') return 'non partito';
  if (!min || min <= 0) return 'in orario';
  return `+${min} min → ${formatHHMM(actualDepartureMs)}`;
}

function buildTrainLi(t, opts) {
  const li = document.createElement('li');
  const cls = delayClass(t.ritardo, t.stato);

  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = (opts && opts.useActualTime) ? formatHHMM(t.actualDepartureMs) : (t.orarioProgrammato || '--:--');

  const mid = document.createElement('div');
  mid.className = 'mid';
  const route = document.createElement('div');
  route.className = 'route';
  route.textContent = `${t.origine} → ${t.destinazione}`;
  const sub = document.createElement('div');
  sub.className = 'via';
  sub.textContent = [t.via ? `via ${t.via}` : null, `REG ${t.numeroTreno}`].filter(Boolean).join(' · ');
  mid.appendChild(route);
  mid.appendChild(sub);

  const platform = document.createElement('div');
  platform.className = 'right';
  const pf = document.createElement('div');
  pf.className = 'platform';
  pf.textContent = t.binario || '–';
  const pfLabel = document.createElement('div');
  pfLabel.className = 'platform-label';
  pfLabel.textContent = 'BIN';
  platform.appendChild(pf);
  platform.appendChild(pfLabel);

  const delay = document.createElement('div');
  delay.className = 'right';
  const d = document.createElement('div');
  d.className = `delay ${cls}`;
  d.textContent = delayText(t.ritardo, t.stato, t.actualDepartureMs);
  delay.appendChild(d);

  li.appendChild(time);
  li.appendChild(mid);
  li.appendChild(platform);
  li.appendChild(delay);
  return li;
}

function renderListInto(ulId, trains, opts) {
  const list = document.getElementById(ulId);
  list.innerHTML = '';
  for (const t of trains) list.appendChild(buildTrainLi(t, opts));
}

function render(trains, filterName) {
  const empty = document.getElementById('empty');
  renderListInto('list', trains);
  if (!trains || trains.length === 0) {
    empty.textContent = filterName
      ? `Nessun treno da ${filterName} nella prossima finestra oraria.`
      : 'Nessun treno regionale nella prossima finestra oraria.';
    empty.hidden = false;
  } else {
    empty.hidden = true;
  }
}

function renderHistory(rows) {
  const wrap = document.getElementById('historyWrap');
  renderListInto('history', rows, { useActualTime: true });
  wrap.hidden = !rows || rows.length === 0;
}

async function refresh() {
  try {
    const rows = await fetchTrains();
    const now = Date.now();
    updateTrainState(rows, now);
    const { upcoming, storico } = deriveLists(now);
    latestUpcoming = upcoming;
    latestHistory = storico;
    hasFetchedOnce = true;
    document.getElementById('error').hidden = true;
    applyFilterAndRender();
    document.getElementById('updated').textContent = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  } catch (err) {
    document.getElementById('error').hidden = false;
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js');
  });
}

initFilters();
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
